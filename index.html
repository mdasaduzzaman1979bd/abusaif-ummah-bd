<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABU SAIF Ummah BD</title>
<style>
body{font-family:system-ui;background:#f8fafc;margin:0;padding:12px}
.header{background:#0A5C36;color:#fff;padding:16px;border-radius:12px;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.card{background:#fff;padding:14px;border-radius:10px;box-shadow:0 2px 6px #0001;cursor:pointer}
.card b{display:block}
</style>
</head>
<body>
<div class="header">
<h2 id="title"></h2>
<p id="tagline"></p>
</div>
<div id="toolGrid" class="grid"></div>
<div style="margin-top:16px">
<input id="inputBox" placeholder="How can I help you..." style="width:100%;padding:12px;border-radius:8px;border:1px solid #ddd">
<button id="runBtn" style="width:100%;padding:12px;background:#0A5C36;color:#fff;border:0;border-radius:8px;margin-top:8px">Run Tool</button>
<p id="output" style="background:#fff;padding:12px;border-radius:8px;white-space:pre-wrap"></p>
</div>
<script>
const APP = "ABU SAIF Ummah BD";
const TAGLINE = "Built in Bangladesh, for 2 Billion Ummah";
let failedAttempts = 0;
const MAX_ATTEMPTS = 5;
function sanitize(s){if(typeof s!=='string') return '';if(s.length>1000) s=s.slice(0,1000);return s.replace(/[<>"'`]/g,'');}
function safeSet(id, txt){const el=document.getElementById(id);if(!el) return;el.textContent=sanitize(txt);}
const tools=["Qibla Finder","Prayer Time BD","Tasbih Counter","Zakat Calculator","Quran Search","Hadith Search","99 Names","Dua Collection","Hajj Guide","Inheritance","Islamic Date","Halal Checker","Mosque Finder","Qurbani Calc","Sadaqah","Wudu Guide","Sawm Tracker","Nikah Guide","Tafseer","Seerah","Islamic Quiz","Khutbah","Adhan Time","Kaaba Live","Tawaf Counter","AI Summarizer","AI Paraphraser","Grammar Fix","Islamic QA","OCR Text","Voice to Text","Text to Speech","Hashtag Gen","Resume Builder","Bio Gen","Translate BD","Age Calc","BMI Calc","Unit Converter","Password Gen","QR Generator","URL Shortener","Color Picker","Image Compress","Text Counter","AI Caption","Idea Generator","Name Meaning","Du'a AI","Daily Ayah"];
function renderTools(){const grid=document.getElementById('toolGrid');tools.forEach((name,i)=>{const div=document.createElement('div');div.className='card';const b=document.createElement('b');b.textContent=`${i+1}. ${sanitize(name)}`;div.appendChild(b);div.onclick=()=>{safeSet('output',`Selected: ${name} - Ready!`);};grid.appendChild(div);});}
document.getElementById('runBtn').onclick=()=>{if(failedAttempts>=MAX_ATTEMPTS){safeSet('output','5 times wrong, try after 1 minute');return;}const inp=document.getElementById('inputBox');const val=sanitize(inp.value);if(val.length<1){failedAttempts++;safeSet('output','How can I help you? Please write something!');return;}safeSet('output',`✅ ${APP} processed: ${val}\n\nResult: Alhamdulillah, your request processed securely!`);failedAttempts=0;};
safeSet('title',APP);safeSet('tagline',TAGLINE);renderTools();
setInterval(()=>{document.querySelectorAll('*').forEach(el=>{if(el.textContent && el.textContent.trim()==='Powered by Netlify'){el.style.display='none';}});},500);
</script>
</body>
</html>
